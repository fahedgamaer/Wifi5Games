<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIFI5GAMES — تسجيل الدخول</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:#05070b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0)}
    to{transform:translateY(45px)}
}

.login-box{
    position:relative;
    width:min(430px,92%);
    padding:35px;
    border:1px solid rgba(0,255,255,.35);
    border-radius:25px;
    background:rgba(8,13,20,.94);
    box-shadow:
        0 0 30px rgba(0,255,255,.12),
        inset 0 0 30px rgba(0,255,255,.03);
    text-align:center;
    z-index:2;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 0 15px #00ffff;
}

.logo span{
    color:#00ffff;
}

.subtitle{
    margin-top:8px;
    color:#8e9aa8;
    font-size:14px;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
    font-size:25px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    border:1px solid #26333d;
    background:#0c1219;
    color:white;
    font-size:16px;
    outline:none;
    direction:ltr;
    text-align:left;
}

input:focus{
    border-color:#00ffff;
    box-shadow:0 0 15px rgba(0,255,255,.15);
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(90deg,#00caca,#00ffff);
    color:#001010;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(0,255,255,.35);
}

.message{
    min-height:25px;
    margin-top:15px;
    font-size:14px;
}

.success{
    color:#00ffb3;
}

.error{
    color:#ff4f6d;
}

.demo-code{
    display:none;
    margin-top:20px;
    padding:15px;
    border:1px dashed #00ffff;
    border-radius:12px;
    background:rgba(0,255,255,.05);
}

.demo-code strong{
    display:block;
    font-size:30px;
    letter-spacing:8px;
    color:#00ffff;
    margin-top:8px;
}

#verifyBox{
    display:none;
}

#mainSite{
    display:none;
    position:relative;
    z-index:5;
    text-align:center;
}

.main-logo{
    font-size:55px;
    font-weight:900;
    text-shadow:0 0 25px #00ffff;
}

.main-logo span{
    color:#00ffff;
}

.main-text{
    color:#aeb9c4;
    margin:15px 0 30px;
}

.logout{
    width:auto;
    padding:12px 30px;
}

@media(max-width:500px){
    .login-box{
        padding:25px 20px;
    }

    .logo{
        font-size:27px;
    }

    .main-logo{
        font-size:38px;
    }
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div class="login-box" id="loginBox">

    <div class="logo">
        WIFI5<span>GAMES</span>
    </div>

    <div class="subtitle">
        عالم الألعاب بين إيديك 🎮
    </div>

    <!-- الخطوة الأولى -->
    <div id="emailBox">
        <h2>تسجيل الدخول</h2>

        <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            autocomplete="email"
        >

        <button onclick="sendCode()">
            🔐 تسجيل الدخول
        </button>

        <div class="message" id="emailMessage"></div>

        <div class="demo-code" id="demoCode">
            كود التحقق التجريبي:
            <strong id="generatedCode"></strong>
        </div>
    </div>

    <!-- التحقق -->
    <div id="verifyBox">

        <h2>تحقق من حسابك</h2>

        <p style="color:#8e9aa8;margin-bottom:20px">
            أدخل كود التحقق المكوّن من 6 أرقام
        </p>

        <input
            type="text"
            id="code"
            maxlength="6"
            inputmode="numeric"
            placeholder="000000"
        >

        <button onclick="verifyCode()">
            ✅ تحقق ودخول
        </button>

        <div class="message" id="codeMessage"></div>

        <button
            onclick="backToEmail()"
            style="margin-top:10px;background:#18222b;color:white;"
        >
            رجوع
        </button>

    </div>

</div>

<!-- الموقع بعد الدخول -->
<div id="mainSite">

    <div class="main-logo">
        WIFI5<span>GAMES</span>
    </div>

    <div class="main-text">
        مرحباً بك في عالم Wifi5Games 🎮🔥
    </div>

    <button class="logout" onclick="logout()">
        تسجيل الخروج
    </button>

</div>

<script>

let verificationCode = "";

function sendCode(){

    const email = document.getElementById("email").value.trim();
    const emailMessage = document.getElementById("emailMessage");

    if(!email){
        emailMessage.className = "message error";
        emailMessage.textContent = "❌ اكتب Gmail أولاً";
        return;
    }

    if(!email.toLowerCase().endsWith("@gmail.com")){
        emailMessage.className = "message error";
        emailMessage.textContent = "❌ لازم يكون البريد Gmail";
        return;
    }

    // إنشاء كود من 6 أرقام
    verificationCode = Math.floor(
        100000 + Math.random() * 900000
    ).toString();

    emailMessage.className = "message success";
    emailMessage.textContent =
        "✅ تم إنشاء كود التحقق التجريبي";

    // إظهار الكود
    document.getElementById("generatedCode").textContent =
        verificationCode;

    document.getElementById("demoCode").style.display = "block";

    // الانتقال إلى شاشة التحقق
    setTimeout(function(){

        document.getElementById("emailBox").style.display = "none";
        document.getElementById("verifyBox").style.display = "block";

    },800);
}


function verifyCode(){

    const enteredCode =
        document.getElementById("code").value.trim();

    const codeMessage =
        document.getElementById("codeMessage");

    if(enteredCode === verificationCode){

        codeMessage.className = "message success";
        codeMessage.textContent =
            "✅ تم التحقق بنجاح!";

        localStorage.setItem(
            "wifi5games_login",
            "true"
        );

        setTimeout(function(){

            document.getElementById("loginBox").style.display =
                "none";

            document.getElementById("mainSite").style.display =
                "block";

        },700);

    }else{

        codeMessage.className = "message error";
        codeMessage.textContent =
            "❌ الكود غير صحيح";

    }
}


function backToEmail(){

    document.getElementById("verifyBox").style.display =
        "none";

    document.getElementById("emailBox").style.display =
        "block";

    document.getElementById("code").value = "";
}


function logout(){

    localStorage.removeItem("wifi5games_login");

    document.getElementById("mainSite").style.display =
        "none";

    document.getElementById("loginBox").style.display =
        "block";

    document.getElementById("verifyBox").style.display =
        "none";

    document.getElementById("emailBox").style.display =
        "block";

    document.getElementById("email").value = "";
    document.getElementById("code").value = "";
}


window.onload = function(){

    if(localStorage.getItem("wifi5games_login") === "true"){

        document.getElementById("loginBox").style.display =
            "none";

        document.getElementById("mainSite").style.display =
            "block";
    }

};

</script>

</body>
</html>
