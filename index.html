<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Console UI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
  background:#071321;
}

.bg{
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 75% 25%,#275f91 0%,transparent 30%),
    radial-gradient(circle at 20% 80%,#193d65 0%,transparent 35%),
    linear-gradient(135deg,#06101c,#102b48);
}

.bg:after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
}

/* TOP BAR */

.top{
  height:75px;
  padding:0 35px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(3,10,18,.35);
  backdrop-filter:blur(18px);
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:2px;
}

.nav{
  display:flex;
  gap:28px;
}

.nav button{
  border:0;
  background:none;
  color:#aeb9c8;
  font-size:16px;
  cursor:pointer;
}

.nav button.active,
.nav button:hover{
  color:white;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#54b4ff,#7657ff);
  display:grid;
  place-items:center;
  font-weight:bold;
}

/* HOME */

main{
  padding:35px;
}

.welcome{
  margin-bottom:28px;
}

.welcome h1{
  font-size:36px;
  margin-bottom:7px;
}

.welcome p{
  color:#aebdcd;
}

.games{
  display:flex;
  gap:22px;
  overflow-x:auto;
  padding:15px 5px 30px;
  scroll-behavior:smooth;
}

.games::-webkit-scrollbar{
  height:5px;
}

.games::-webkit-scrollbar-thumb{
  background:#71849a;
  border-radius:20px;
}

.game{
  min-width:245px;
  height:330px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.25s;
  border:2px solid transparent;
  flex-shrink:0;
}

.game.selected{
  transform:scale(1.06) translateY(-7px);
  border-color:white;
  box-shadow:0 15px 45px rgba(0,0,0,.55);
}

.game img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.game:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 40%,rgba(0,0,0,.9));
}

.game-info{
  position:absolute;
  z-index:2;
  bottom:18px;
  right:18px;
  left:18px;
}

.game-info h2{
  font-size:21px;
}

.game-info p{
  margin-top:7px;
  color:#c1ccd8;
  font-size:13px;
}

/* QUICK BUTTONS */

.quick{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.quick button{
  padding:12px 20px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:10px;
  cursor:pointer;
}

.quick button:hover{
  background:rgba(255,255,255,.18);
}

/* CONTROL CENTER */

.panel{
  position:fixed;
  left:50%;
  bottom:-400px;
  transform:translateX(-50%);
  width:min(850px,94%);
  padding:22px;
  border-radius:25px;
  background:rgba(8,18,31,.94);
  backdrop-filter:blur(25px);
  box-shadow:0 20px 80px #000;
  transition:.35s;
  z-index:20;
}

.panel.open{
  bottom:25px;
}

.panel h2{
  margin-bottom:17px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.control{
  min-height:75px;
  border:1px solid rgba(255,255,255,.1);
  background:#13263c;
  border-radius:14px;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.control:hover{
  background:#20466b;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  display:none;
  place-items:center;
  z-index:30;
}

.modal.show{
  display:grid;
}

.box{
  width:min(700px,92%);
  background:#0c1b2d;
  border-radius:22px;
  padding:28px;
  box-shadow:0 25px 90px #000;
}

.box h2{
  font-size:30px;
  margin-bottom:15px;
}

.box p{
  color:#adbac8;
  line-height:1.8;
}

.box button{
  margin-top:22px;
  padding:12px 25px;
  border:0;
  border-radius:9px;
  cursor:pointer;
}

/* SETTINGS */

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.toggle{
  width:50px;
  height:27px;
  border-radius:20px;
  background:#287dcc;
  position:relative;
}

.toggle:after{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  background:white;
  border-radius:50%;
  top:3px;
  right:3px;
}

/* MOBILE */

@media(max-width:650px){

  .top{
    padding:0 15px;
  }

  .nav{
    gap:10px;
  }

  .nav button{
    font-size:12px;
  }

  main{
    padding:22px 15px;
  }

  .welcome h1{
    font-size:27px;
  }

  .game{
    min-width:200px;
    height:275px;
  }

  .controls{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<header class="top">

  <div class="logo">CONSOLE</div>

  <div class="nav">
    <button class="active">الرئيسية</button>
    <button onclick="library()">الألعاب</button>
    <button onclick="profile()">الملف الشخصي</button>
    <button onclick="settings()">⚙️</button>
  </div>

  <div class="avatar">G</div>

</header>


<main>

  <section class="welcome">
    <h1>مرحباً 👋</h1>
    <p>اختر لعبة للبدء</p>
  </section>


  <section class="games" id="games">

    <div class="game selected"
         data-name="Grand Theft Auto V"
         onclick="selectGame(this)">
      <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420">
      <div class="game-info">
        <h2>Grand Theft Auto V</h2>
        <p>Action • Open World</p>
      </div>
    </div>


    <div class="game"
         data-name="Fortnite"
         onclick="selectGame(this)">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e">
      <div class="game-info">
        <h2>Fortnite</h2>
        <p>Battle Royale</p>
      </div>
    </div>


    <div class="game"
         data-name="Minecraft"
         onclick="selectGame(this)">
      <img src="https://images.unsplash.com/photo-1607513746994-51f730a44832">
      <div class="game-info">
        <h2>Minecraft</h2>
        <p>Adventure</p>
      </div>
    </div>


    <div class="game"
         data-name="Racing"
         onclick="selectGame(this)">
      <img src="https://images.unsplash.com/photo-1503736334956-4c8f8e92946d">
      <div class="game-info">
        <h2>Racing</h2>
        <p>Cars • Racing</p>
      </div>
    </div>


    <div class="game"
         data-name="Football"
         onclick="selectGame(this)">
      <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55">
      <div class="game-info">
        <h2>Football</h2>
        <p>Sports</p>
      </div>
    </div>

  </section>


  <div class="quick">
    <button onclick="openGame()">▶ تشغيل اللعبة</button>
    <button onclick="openControl()">🎮 مركز التحكم</button>
    <button onclick="library()">📚 المكتبة</button>
    <button onclick="settings()">⚙️ الإعدادات</button>
  </div>

</main>


<!-- CONTROL CENTER -->

<div class="panel" id="controlPanel">

  <h2>مركز التحكم</h2>

  <div class="controls">

    <button class="control" onclick="message('الشبكة')">
      🌐<br>الشبكة
    </button>

    <button class="control" onclick="message('الصوت')">
      🔊<br>الصوت
    </button>

    <button class="control" onclick="message('اليد')">
      🎮<br>وحدة التحكم
    </button>

    <button class="control" onclick="message('الإشعارات')">
      🔔<br>الإشعارات
    </button>

    <button class="control" onclick="message('التنزيلات')">
      ⬇️<br>التنزيلات
    </button>

    <button class="control" onclick="settings()">
      ⚙️<br>الإعدادات
    </button>

    <button class="control" onclick="message('الموسيقى')">
      🎵<br>الموسيقى
    </button>

    <button class="control" onclick="powerMenu()">
      ⏻<br>الطاقة
    </button>

  </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="box">

    <h2 id="modalTitle">اللعبة</h2>

    <p id="modalText">
      جاري تجهيز اللعبة...
    </p>

    <button onclick="closeModal()">إغلاق</button>

  </div>

</div>


<script>

let selected =
  document.querySelector(".game.selected");


/* اختيار لعبة */

function selectGame(element){

  document
    .querySelectorAll(".game")
    .forEach(g => g.classList.remove("selected"));

  element.classList.add("selected");

  selected = element;
}


/* تشغيل اللعبة */

function openGame(){

  if(!selected) return;

  const name =
    selected.dataset.name;

  showModal(
    name,
    "تم اختيار " + name +
    " 🎮<br><br>" +
    "هنا سنربط اللعبة الحقيقية في المرحلة القادمة."
  );
}


/* مركز التحكم */

function openControl(){

  document
    .getElementById("controlPanel")
    .classList.toggle("open");
}


/* الإعدادات */

function settings(){

  showModal(
    "⚙️ الإعدادات",

    `<div class="setting">
      <span>الإنترنت</span>
      <span class="toggle"></span>
    </div>

    <div class="setting">
      <span>الصوت</span>
      <span class="toggle"></span>
    </div>

    <div class="setting">
      <span>الإشعارات</span>
      <span class="toggle"></span>
    </div>

    <div class="setting">
      <span>وضع ملء الشاشة</span>
      <span class="toggle"></span>
    </div>`
  );
}


/* الملف الشخصي */

function profile(){

  showModal(
    "👤 الملف الشخصي",
    "اللاعب: G<br><br>" +
    "الألعاب: 5<br>" +
    "الإنجازات: 12<br>" +
    "وقت اللعب: 24 ساعة"
  );
}


/* المكتبة */

function library(){

  showModal(
    "📚 مكتبة الألعاب",
    "لديك حالياً 5 ألعاب في المكتبة.<br><br>" +
    "Grand Theft Auto V<br>" +
    "Fortnite<br>" +
    "Minecraft<br>" +
    "Racing<br>" +
    "Football"
  );
}


/* الطاقة */

function powerMenu(){

  showModal(
    "⏻ الطاقة",
    "اختر الإجراء:<br><br>" +
    "وضع السكون<br>" +
    "إعادة التشغيل<br>" +
    "إيقاف التشغيل"
  );
}


/* رسائل مركز التحكم */

function message(name){

  showModal(
    name,
    "تم فتح إعدادات " + name + " 🎮"
  );
}


/* نافذة */

function showModal(title,text){

  document.getElementById("modalTitle")
    .innerHTML = title;

  document.getElementById("modalText")
    .innerHTML = text;

  document.getElementById("modal")
    .classList.add("show");
}


function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");
}


/* التنقل بالكيبورد */

document.addEventListener("keydown",function(e){

  const games =
    [...document.querySelectorAll(".game")];

  let index =
    games.indexOf(selected);

  if(e.key === "ArrowRight"){

    index++;

    if(index >= games.length)
      index = 0;

    selectGame(games[index]);
  }


  if(e.key === "ArrowLeft"){

    index--;

    if(index < 0)
      index = games.length - 1;

    selectGame(games[index]);
  }


  if(e.key === "Enter"){

    openGame();
  }


  if(e.key === "Escape"){

    closeModal();

    document
      .getElementById("controlPanel")
      .classList.remove("open");
  }

});


/* إغلاق بالنقر خارج النافذة */

document
  .getElementById("modal")
  .addEventListener("click",function(e){

    if(e.target === this)
      closeModal();

  });

</script>

</body>
</html>
