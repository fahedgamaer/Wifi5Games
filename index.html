<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي للفيديوهات</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
    }

    /* الشريط العلوي */
    header {
      height: 65px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff0000;
    }

    .search {
      display: flex;
      width: 45%;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      background: #121212;
      color: white;
      outline: none;
      border-radius: 5px 0 0 5px;
    }

    .search button {
      width: 55px;
      border: none;
      background: #303030;
      color: white;
      cursor: pointer;
    }

    /* القائمة */
    nav {
      width: 220px;
      position: fixed;
      right: 0;
      top: 65px;
      bottom: 0;
      background: #181818;
      padding: 20px;
    }

    nav button {
      width: 100%;
      padding: 14px;
      margin-bottom: 8px;
      background: transparent;
      border: none;
      color: white;
      text-align: right;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }

    nav button:hover {
      background: #303030;
    }

    /* الفيديوهات */
    main {
      margin-right: 220px;
      padding: 25px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .video {
      cursor: pointer;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      background: #333;
    }

    .video h3 {
      font-size: 16px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .video p {
      color: #aaa;
      margin-top: 5px;
      font-size: 14px;
    }

    /* الجوال */
    @media (max-width: 700px) {
      nav {
        display: none;
      }

      main {
        margin-right: 0;
        padding: 12px;
      }

      .search {
        width: 55%;
      }

      header {
        padding: 0 10px;
      }

      .videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">▶ موقعي</div>

  <div class="search">
    <input id="searchInput" type="text" placeholder="بحث...">
    <button onclick="searchVideos()">🔍</button>
  </div>
</header>

<nav>
  <button onclick="showAll()">🏠 الرئيسية</button>
  <button>🔥 الشائع</button>
  <button>📺 الاشتراكات</button>
  <button>🎵 الموسيقى</button>
  <button>🎮 الألعاب</button>
</nav>

<main>
  <div class="videos" id="videos">

    <div class="video" data-title="فيديو برمجة HTML">
      <img class="thumbnail"
        src="https://picsum.photos/600/350?random=1">
      <h3>تعلم HTML من الصفر</h3>
      <p>قناة البرمجة • 120 ألف مشاهدة</p>
    </div>

    <div class="video" data-title="تعلم JavaScript">
      <img class="thumbnail"
        src="https://picsum.photos/600/350?random=2">
      <h3>تعلم JavaScript بسهولة</h3>
      <p>عالم البرمجة • 85 ألف مشاهدة</p>
    </div>

    <div class="video" data-title="تصميم المواقع">
      <img class="thumbnail"
        src="https://picsum.photos/600/350?random=3">
      <h3>كيف تصمم موقع احترافي؟</h3>
      <p>Web Studio • 300 ألف مشاهدة</p>
    </div>

    <div class="video" data-title="تعلم CSS">
      <img class="thumbnail"
        src="https://picsum.photos/600/350?random=4">
      <h3>شرح CSS للمبتدئين</h3>
      <p>Code بالعربي • 60 ألف مشاهدة</p>
    </div>

  </div>
</main>

<script>
  function searchVideos() {
    const input =
      document.getElementById("searchInput").value.toLowerCase();

    const videos =
      document.querySelectorAll(".video");

    videos.forEach(video => {
      const title =
        video.dataset.title.toLowerCase();

      if (title.includes(input)) {
        video.style.display = "block";
      } else {
        video.style.display = "none";
      }
    });
  }

  function showAll() {
    document.getElementById("searchInput").value = "";

    document.querySelectorAll(".video").forEach(video => {
      video.style.display = "block";
    });
  }

  document
    .getElementById("searchInput")
    .addEventListener("keyup", searchVideos);
</script>

</body>
</html>
