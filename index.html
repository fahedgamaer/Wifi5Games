‏<!DOCTYPE html>
‏<html lang="ar" dir="rtl">
‏<head>
‏<meta charset="UTF-8">
‏<meta name="viewport" content="width=device-width, initial-scale=1.0">
‏
‏<title>WIFI5GAMES — عالم الألعاب بين إيديك</title>
‏
‏<style>
‏@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
‏
‏*{
‏    margin:0;
‏    padding:0;
‏    box-sizing:border-box;
‏}
‏
‏html{
‏    scroll-behavior:smooth;
‏}
‏
‏body{
‏    font-family:'Cairo',sans-serif;
‏    background:#05070d;
‏    color:white;
‏    overflow-x:hidden;
‏}
‏
‏/* BACKGROUND */
‏body:before{
‏    content:"";
‏    position:fixed;
‏    inset:0;
‏    z-index:-3;
‏    background:
‏        linear-gradient(rgba(0,255,255,.025) 1px,transparent 1px),
‏        linear-gradient(90deg,rgba(0,255,255,.025) 1px,transparent 1px);
‏    background-size:45px 45px;
‏}
‏
‏body:after{
‏    content:"";
‏    position:fixed;
‏    inset:0;
‏    z-index:-2;
‏    background:
‏        radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
‏        radial-gradient(circle at 80% 30%,rgba(110,0,255,.12),transparent 30%),
‏        radial-gradient(circle at 50% 90%,rgba(0,100,255,.08),transparent 35%);
‏    pointer-events:none;
‏}
‏
‏/* LOADER */
‏#loader{
‏    position:fixed;
‏    inset:0;
‏    background:#03050a;
‏    display:flex;
‏    justify-content:center;
‏    align-items:center;
‏    flex-direction:column;
‏    z-index:99999;
‏    transition:.7s;
‏}
‏
‏.loader-logo{
‏    font-size:48px;
‏    font-weight:900;
‏    letter-spacing:3px;
‏    text-shadow:0 0 20px #00ffff;
‏}
‏
‏.loader-logo span{
‏    color:#00ffff;
‏}
‏
‏.loader-sub{
‏    margin-top:8px;
‏    color:#8c9aaa;
‏    font-size:14px;
‏}
‏
‏.loader-box{
‏    width:280px;
‏    height:6px;
‏    background:#17202b;
‏    border-radius:20px;
‏    overflow:hidden;
‏    margin-top:30px;
‏}
‏
‏.loader-bar{
‏    width:0%;
‏    height:100%;
‏    background:linear-gradient(90deg,#00ffff,#008cff,#8c00ff);
‏    box-shadow:0 0 20px #00ffff;
‏    transition:.1s;
‏}
‏
‏.loader-percent{
‏    margin-top:12px;
‏    color:#00ffff;
‏    font-weight:800;
‏}
‏

‏header{
‏    height:82px;
‏    display:flex;
‏    align-items:center;
‏    justify-content:space-between;

‏    top:0;
‏    z-index:1000;
‏    background:rgba(3,6,12,.86);
‏    backdrop-filter:blur(18px);
‏    border-bottom:1px solid rgba(0,255,255,.12);
‏}
‏
‏.logo{
‏    font-size:25px;
‏    font-weight:900;
‏    color:white;
‏    text-shadow:0 0 15px #00ffff;
‏}
‏
‏.logo span{
‏    color:#00ffff;
‏}
‏
‏.logo small{
‏    display:block;
‏    font-size:9px;
‏    color:#778394;

‏}
‏

‏

‏    font-weight:700;

‏}
‏

‏

‏    font-family:inherit;
‏    font-weight:800;
‏}
‏
