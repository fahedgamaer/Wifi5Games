<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050914;
    font-family:Arial,sans-serif;
    color:white;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#0b1724;
    padding:30px;
    border-radius:20px;
    border:1px solid #159bd3;
    box-shadow:0 0 35px rgba(0,180,255,.2);
}

h2{
    text-align:center;
    color:#35c8ff;
}

p{
    text-align:center;
    color:#91a7b8;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    box-sizing:border-box;
    border-radius:10px;
    border:1px solid #29485b;
    background:#07111a;
    color:white;
    font-size:16px;
    outline:none;
    direction:ltr;
}

input:focus{
    border-color:#35c8ff;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#35c8ff;
    color:#00121c;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>🔐 تسجيل الدخول</h2>

    <p>أدخل بريدك الإلكتروني</p>

    <input
        id="email"
        type="email"
        placeholder="مثال: fahed@gmail.com"
        autocomplete="email"
    >

    <button onclick="login()">
        تسجيل الدخول
    </button>

    <div id="message"></div>

</div>

<script>

function login(){

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");

    if(email === ""){
        message.style.color = "#ff5555";
        message.textContent =
            "❌ اكتب بريدك الإلكتروني";
        return;
    }

    if(!email.endsWith("@gmail.com")){
        message.style.color = "#ff5555";
        message.textContent =
            "❌ لازم يكون الإيميل من نوع @gmail.com";
        return;
    }

    if(email.length <= "@gmail.com".length){
        message.style.color = "#ff5555";
        message.textContent =
            "❌ اكتب اسم الإيميل قبل @gmail.com";
        return;
    }

    message.style.color = "#35c8ff";
    message.textContent =
        "✅ تم إدخال الإيميل بشكل صحيح: " + email;

}

</script>

</body>
</html>
