<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WIFI5GAMES — عالم الألعاب</title>
<meta name="description" content="WIFI5GAMES — عالم الألعاب وأكثر من 100 لعبة شهيرة.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
 --cyan:#00eaff;
 --blue:#087cff;
 --purple:#792cff;
 --pink:#ff2bd6;
 --green:#00ff9d;
 --bg:#03050a;
}

html{scroll-behavior:smooth}

body{
 font-family:Cairo,sans-serif;
 background:#03050a;
 color:#fff;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-5;
 pointer-events:none;
 background:
 radial-gradient(circle at 10% 10%,rgba(0,234,255,.12),transparent 25%),
 radial-gradient(circle at 90% 25%,rgba(121,44,255,.12),transparent 28%),
 radial-gradient(circle at 50% 100%,rgba(255,43,214,.08),transparent 30%);
}

body:after{
 content:"";
 position:fixed;
 inset:0;
 z-index:-4;
 pointer-events:none;
 opacity:.22;
 background-image:
 linear-gradient(rgba(0,234,255,.06) 1px,transparent 1px),
 linear-gradient(90deg,rgba(0,234,255,.06) 1px,transparent 1px);
 background-size:50px 50px;
}

/* LOADER */

#loader{
 position:fixed;
 inset:0;
 z-index:99999;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#02040a;
 transition:.7s;
}

#loader.hide{
 opacity:0;
 visibility:hidden;
}

.loader-box{
 width:min(500px,90%);
 text-align:center;
}

.loader-logo{
 font-size:45px;
 font-weight:900;
 letter-spacing:3px;
 text-shadow:0 0 25px var(--cyan);
}

.loader-logo span{color:var(--cyan)}

.loader-sub{
 color:#7f8b9d;
 font-size:12px;
 letter-spacing:4px;
 margin:5px 0 30px;
}

.loader-ring{
 width:115px;
 height:115px;
 margin:auto;
 border:3px solid rgba(0,234,255,.12);
 border-top-color:var(--cyan);
 border-right-color:var(--purple);
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 animation:spin 1s linear infinite;
}

.loader-ring span{font-size:38px}

.loader-progress{
 height:7px;
 background:#101722;
 border-radius:20px;
 overflow:hidden;
 margin-top:30px;
}

.loader-progress div{
 width:0;
 height:100%;
 background:linear-gradient(90deg,var(--purple),var(--cyan));
 box-shadow:0 0 20px var(--cyan);
}

.loader-percent{
 color:var(--cyan);
 font-size:14px;
 font-weight:900;
 margin-top:10px;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */

#loginScreen{
 position:fixed;
 inset:0;
 z-index:9999;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at center,rgba(0,234,255,.09),transparent 30%),
 #03050a;
}

.login-box{
 width:min(440px,100%);
 padding:35px;
 text-align:center;
 background:rgba(7,12,20,.96);
 border:1px solid rgba(0,234,255,.25);
 border-radius:25px;
 box-shadow:0 0 70px rgba(0,234,255,.08);
}

.login-logo{
 font-size:32px;
 font-weight:900;
 text-shadow:0 0 20px var(--cyan);
}

.login-logo span{color:var(--cyan)}

.login-box h2{
 margin-top:15px;
 font-size:22px;
}

.login-box p{
 color:#8793a4;
 font-size:12px;
 margin:8px 0 25px;
}

.login-input{
 width:100%;
 height:52px;
 margin-bottom:12px;
 padding:0 16px;
 border:1px solid #1c2938;
 border-radius:12px;
 background:#050a12;
 color:#fff;
 outline:none;
 font-family:inherit;
}

.login-input:focus{
 border-color:var(--cyan);
 box-shadow:0 0 20px rgba(0,234,255,.1);
}

.login-btn{
 width:100%;
 height:52px;
 border:0;
 border-radius:12px;
 background:linear-gradient(90deg,var(--cyan),#6af7ff);
 color:#001018;
 font-family:inherit;
 font-weight:900;
 cursor:pointer;
}

.login-error{
 min-height:20px;
 margin-top:10px;
 color:#ff5570;
 font-size:12px;
}

/* NAV */

nav{
 position:sticky;
 top:0;
 z-index:1000;
 height:78px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 background:rgba(3,5,10,.84);
 backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
 font-size:25px;
 font-weight:900;
 white-space:nowrap;
}

.logo span{
 color:var(--cyan);
 text-shadow:0 0 15px var(--cyan);
}

.logo small{
 display:block;
 color:#718093;
 font-size:8px;
 letter-spacing:3px;
 margin-top:-5px;
}

.nav-links{
 display:flex;
 gap:25px;
}

.nav-links a{
 color:#aeb8c7;
 text-decoration:none;
 font-size:13px;
 font-weight:700;
}

.nav-links a:hover{color:var(--cyan)}

.user-area{
 display:flex;
 gap:8px;
 align-items:center;
}

.user-pill{
 display:none;
 padding:7px 12px;
 border:1px solid rgba(0,234,255,.2);
 border-radius:30px;
 color:var(--cyan);
 font-size:11px;
}

.logout{
 display:none;
 padding:8px 12px;
 border-radius:10px;
 background:#111923;
 border:1px solid #263344;
 color:#fff;
 font-family:inherit;
 cursor:pointer;
 font-size:11px;
}

/* HERO */

.hero{
 min-height:650px;
 display:grid;
 grid-template-columns:1.1fr .9fr;
 align-items:center;
 gap:50px;
 padding:70px 7%;
}

.hero-badge{
 display:inline-flex;
 align-items:center;
 gap:8px;
 padding:7px 14px;
 margin-bottom:18px;
 border:1px solid rgba(0,234,255,.25);
 border
