<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WIFI5GAMES — Ultimate Gaming</title>

<meta name="description" content="WIFI5GAMES — عالم الألعاب والجيمنج. اكتشف أشهر ألعاب الكمبيوتر وروابطها الرسمية.">
<meta name="keywords" content="Wifi5Games, ألعاب, GTA V, Fortnite, Counter Strike, Minecraft, Gaming">
<meta name="theme-color" content="#00eaff">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Cairo",sans-serif;
    background:#05070d;
    color:#fff;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
    linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
    background-size:50px 50px;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:#03050a;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:.6s;
}

.loader-logo{
    font-size:45px;
    font-weight:900;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 25px #00eaff;
}

.loader-logo span{
    color:#00eaff;
}

.loader-bar{
    width:260px;
    height:5px;
    background:#151b25;
    border-radius:20px;
    margin-top:25px;
    overflow:hidden;
}

.loader-progress{
    width:0%;
    height:100%;
    background:#00eaff;
    box-shadow:0 0 20px #00eaff;
}

.loader-text{
    margin-top:12px;
    color:#777;
    font-size:13px;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:78px;
    z-index:1000;
    background:rgba(4,7,13,.82);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(0,234,255,.12);
}

.nav{
    max-width:1250px;
    height:100%;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#00eaff;
}

.logo small{
    display:block;
    color:#777;
    font-size:8px;
    letter-spacing:4px;
    text-align:center;
}

.nav-links{
    display:flex;
    gap:25px;
    list-style:none;
}

.nav-links a{
    color:#aaa;
    transition:.3s;
    font-size:14px;
}

.nav-links a:hover{
    color:#00eaff;
}

.login-btn{
    border:1px solid #00eaff;
    background:rgba(0,234,255,.08);
    color:#00eaff;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    transition:.3s;
}

.login-btn:hover{
    background:#00eaff;
    color:#001016;
    box-shadow:0 0 25px rgba(0,234,255,.4);
}

/* HERO */

.hero{
    min-height:700px;
    padding:150px 20px 80px;
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:50px;
}

.hero-text{
    flex:1;
}

.live{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(0,234,255,.3);
    background:rgba(0,234,255,.06);
    color:#00eaff;
    padding:7px 13px;
    border-radius:30px;
    font-size:12px;
    margin-bottom:20px;
}

.live i{
    width:7px;
    height:7px;
    background:#00eaff;
    border-radius:50%;
    box-shadow:0 0 10px #00eaff;
}

.hero h1{
    font-size:clamp(45px,8vw,90px);
    line-height:.95;
    font-weight:900;
    letter-spacing:-3px;
}

.hero h1 span{
    color:#00eaff;
    text-shadow:0 0 30px rgba(0,234,255,.5);
}

.hero p{
    color:#8e96a5;
    max-width:650px;
    margin:25px 0;
    line-height:2;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.primary{
    background:#00eaff;
    color:#001016;
    padding:13px 25px;
    border:0;
    border-radius:10px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 25px rgba(0,234,255,.2);
}

.secondary{
    border:1px solid #26323d;
    background:#0b1018;
    color:#fff;
    padding:13px 25px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.hero-art{
    width:430px;
    height:430px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.ring{
    position:absolute;
    border:1px solid rgba(0,234,255,.3);
    border-radius:50%;
    animation:spin 15s linear infinite;
}

.r1{
    width:390px;
    height:390px;
}

.r2{
    width:300px;
    height:300px;
    border-color:rgba(0,234,255,.18);
    animation-duration:10s;
    animation-direction:reverse;
}

.r3{
    width:210px;
    height:210px;
    border-color:rgba(0,234,255,.5);
    animation-duration:7s;
}

.hero-logo{
    font-size:55px;
    font-weight:900;
    color:#fff;
    text-shadow:0 0 35px #00eaff;
    z-index:2;
}

.hero-logo span{
    color:#00eaff;
}

@keyframes spin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

/* SECTION */

.section{
    max-width:1250px;
    margin:auto;
    padding:70px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:35px;
    font-weight:900;
}

.section-title h2 span{
    color:#00eaff;
}

.section-title p{
    color:#777;
    margin-top:8px;
}

/* SEARCH */

.search-box{
    max-width:650px;
    margin:0 auto 35px;
}

.search-box input{
    width:100%;
    background:#0b1018;
    border:1px solid #202b37;
    outline:none;
    color:#fff;
    padding:15px 20px;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
}

.search-box input:focus{
    border-color:#00eaff;
    box-shadow:0 0 20px rgba(0,234,255,.08);
}

/* GAMES */

.games-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.game-card{
    background:linear-gradient(145deg,#0c1119,#080b11);
    border:1px solid #1b2631;
    border-radius:16px;
    overflow:hidden;
    transition:.35s;
}

.game-card:hover{
    transform:translateY(-7px);
    border-color:rgba(0,234,255,.6);
    box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 25px rgba(0,234,255,.08);
}

.game-cover{
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:900;
    text-align:center;
    padding:15px;
    background:
    radial-gradient(circle at center,rgba(0,234,255,.18),transparent 60%),
    linear-gradient(135deg,#111c27,#071018);
}

.game-cover.gta{
    color:#fff;
    text-shadow:0 0 20px #00eaff;
}

.game-cover.fortnite{
    color:#7cf8ff;
}

.game-cover.cs{
    color:#ffbd62;
}

.game-cover.minecraft{
    color:#7aff8b;
}

.game-cover.roblox{
    color:#fff;
}

.game-cover.pubg{
    color:#ffb42e;
}

.game-cover.apex{
    color:#ff5f5f;
}

.game-cover.warframe{
    color:#bca7ff;
}

.game-cover.dota{
    color:#ff6e54;
}

.game-cover.tf{
    color:#ffc76b;
}

.game-cover.terraria{
    color:#75ff86;
}

.game-cover.truck{
    color:#64d9ff;
}

.game-cover.dark{
    color:#aaa;
}

.game-cover.unturned{
    color:#baff6c;
}

.game-cover.paladins{
    color:#ff79e1;
}

.game-cover.brawlhalla{
    color:#ffe46c;
}

.game-cover.rocket{
    color:#64b7ff;
}

.game-cover.sims{
    color:#70d8ff;
}

.game-cover.fall{
    color:#ff82dc;
}

.game-cover.gta6{
    color:#ff65e6;
}

.game-info{
    padding:18px;
}

.game-info h3{
    font-size:17px;
    margin-bottom:7px;
}

.game-info p{
    color:#727b89;
    font-size:12px;
    min-height:40px;
    line-height:1.7;
}

.game-btn{
    display:block;
    text-align:center;
    margin-top:15px;
    padding:10px;
    border-radius:9px;
    background:#0b2027;
    border:1px solid rgba(0,234,255,.25);
    color:#00eaff;
    font-size:13px;
    font-weight:800;
    transition:.3s;
}

.game-btn:hover{
    background:#00eaff;
    color:#001016;
}

/* FEATURES */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.feature{
    background:#0a0f17;
    border:1px solid #1a2530;
    border-radius:15px;
    padding:30px;
    text-align:center;
}

.feature-icon{
    font-size:35px;
    margin-bottom:10px;
}

.feature h3{
    margin-bottom:8px;
}

.feature p{
    color:#777;
    font-size:13px;
    line-height:1.8;
}

/* FOOTER */

footer{
    border-top:1px solid #151e28;
    margin-top:50px;
    padding:40px 20px;
    text-align:center;
    color:#666;
}

footer strong{
    color:#00eaff;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:5000;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#0a0f17;
    border:1px solid rgba(0,234,255,.35);
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 50px rgba(0,234,255,.12);
    position:relative;
}

.close{
    position:absolute;
    top:12px;
    left:15px;
    background:none;
    border:0;
    color:#777;
    font-size:25px;
    cursor:pointer;
}

.modal-box h2{
    text-align:center;
    font-size:25px;
    margin-bottom:7px;
}

.modal-box h2 span{
    color:#00eaff;
}

.modal-sub{
    color:#777;
    text-align:center;
    font-size:12px;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:13px 15px;
    background:#05080d;
    border:1px solid #24303d;
    border-radius:10px;
    outline:none;
    color:#fff;
    margin-bottom:12px;
    direction:ltr;
    text-align:left;
}

.input:focus{
    border-color:#00eaff;
}

.action{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#00eaff;
    color:#001016;
    font-weight:900;
    cursor:pointer;
}

.action:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    text-align:center;
    min-height:25px;
    font-size:12px;
    margin-top:12px;
    color:#00eaff;
}

.otp-box{
    display:none;
    margin-top:15px;
}

.otp-box.show{
