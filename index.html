<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Next Console</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    background:#07111d;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(
            circle at 75% 30%,
            rgba(50,130,210,.55),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(30,75,125,.45),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #030914,
            #0a2038 55%,
            #06111e
        );
}

.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,.035),
            transparent 65%
        );
    animation:backgroundMove 8s infinite alternate;
}

@keyframes backgroundMove{
    from{
        transform:translateX(-8%);
    }
    to{
        transform:translateX(8%);
    }
}

/* ================= TOP ================= */

.topbar{
    height:82px;
    padding:0 35px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(2,8,15,.25);
    backdrop-filter:blur(20px);
}

.logo{
    font-size:23px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo span{
    color:#55b9ff;
}

.top-icons{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:rgba(255,255,255,.07);

    cursor:pointer;

    transition:.2s;
}

.icon:hover{
    background:rgba(255,255,255,.16);
    transform:scale(1.08);
}

.avatar{
    width:44px;
    height:44px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58c1ff,
            #745cff
        );

    font-weight:bold;

    cursor:pointer;
}

/* ================= MAIN ================= */

main{
    height:calc(100vh - 82px);
    padding:20px 38px;
}

.greeting{
    margin-bottom:20px;
}

.greeting h1{
    font-size:34px;
    margin-bottom:6px;
}

.greeting p{
    color:#a9bacb;
}

/* ================= GAMES ================= */

.games{
    display:flex;
    gap:22px;

    overflow-x:auto;

    padding:18px 8px 35px;

    scrollbar-width:none;
}

.games::-webkit-scrollbar{
    display:none;
}

.game{
    position:relative;

    min-width:245px;
    height:330px;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;

    border:2px solid transparent;

    transition:
        transform .3s,
        box-shadow .3s,
        border .3s;
}

.game img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;
}

.game::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            transparent 35%,
            rgba(0,0,0,.9)
        );
}

.game.selected{
    transform:
        translateY(-12px)
        scale(1.05);

    border-color:white;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);
}

.game.selected img{
    transform:scale(1.08);
}

.game-info{
    position:absolute;

    right:20px;
    left:20px;
    bottom:20px;

    z-index:2;
}

.game-info h2{
    font-size:22px;
    margin-bottom:6px;
}

.game-info p{
    color:#c4d0dc;
    font-size:13px;
}

/* ================= BUTTONS ================= */

.actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.action{
    border:1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.07);

    color:white;

    padding:13px 22px;

    border-radius:11px;

    cursor:pointer;

    transition:.2s;
}

.action:hover{
    background:
        rgba(255,255,255,.17);

    transform:translateY(-2px);
}

/* ================= CONTROL CENTER ================= */

.control-center{
    position:fixed;

    left:50%;

    bottom:-430px;

    transform:translateX(-50%);

    width:min(850px,94%);

    padding:22px;

    border-radius:25px;

    background:
        rgba(7,17,29,.94);

    backdrop-filter:blur(28px);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.8);

    transition:.35s;

    z-index:50;
}

.control-center.open{
    bottom:25px;
}

.control-title{
    font-size:21px;
    margin-bottom:16px;
}

.controls{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}

.control{
    min-height:78px;

    border:1px solid rgba(255,255,255,.08);

    background:#13283f;

    color:white;

    border-radius:15px;

    cursor:pointer;

    transition:.2s;
}

.control:hover{
    background:#20527d;

    transform:translateY(-2px);
}

/* ================= MODAL ================= */

.overlay{
    position:fixed;

    inset:0;

    display:none;

    place-items:center;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:blur(12px);

    z-index:100;
}

.overlay.show{
    display:grid;
}

.modal{
    width:min(720px,92%);

    padding:30px;

    border-radius:23px;

    background:
        rgba(9,22,38,.97);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px #000;

    animation:
        modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.modal h2{
    font-size:30px;
    margin-bottom:15px;
}

.modal p{
    color:#b6c4d2;
    line-height:1.8;
}

.close{
    margin-top:22px;

    padding:12px 25px;

    border:0;

    border-radius:9px;

    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .topbar{
        padding:0 15px;
    }

    .top-icons{
        gap:8px;
    }

    main{
        padding:20px 15px;
    }

    .greeting h1{
        font-size:27px;
    }

    .game{
        min-width:200px;
        height:280px;
    }

    .controls{
        grid-template-columns:
            repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="background"></div>

<header class="topbar">

    <div class="logo">
        NEXT<span>CONSOLE</span>
    </div>

    <div class="top-icons">

        <div class="icon"
             onclick="notifications()">
            🔔
        </div>

        <div class="icon"
             onclick="openControlCenter()">
            ⚙
        </div>

        <div class="avatar"
             onclick="profile()">
            G
        </div>

    </div>

</header>


<main>

    <section class="greeting">

        <h1>
            مرحباً بك 👋
        </h1>

        <p>
            اختر لعبة للبدء
        </p>

    </section>


    <section class="games"
             id="games">


        <div class="game selected"
             onclick="selectGame(this)"
             data-name="Grand Theft Auto V">

            <img src=
            "https://images.unsplash.com/photo-1511512578047-dfb367046420">

            <div class="game-info">

                <h2>
                    Grand Theft Auto V
                </h2>

                <p>
                    Action • Open World
                </p>

            </div>

        </div>


        <div class="game"
             onclick="selectGame(this)"
             data-name="Fortnite">

            <img src=
            "https://images.unsplash.com/photo-1542751371-adc38448a05e">

            <div class="game-info">

                <h2>
                    Fortnite
                </h2>

                <p>
                    Battle Royale
                </p>

            </div>

        </div>


        <div class="game"
             onclick="selectGame(this)"
             data-name="Minecraft">

            <img src=
            "https://images.unsplash.com/photo-1607513746994-51f730a44832">

            <div class="game-info">

                <h2>
                    Minecraft
                </h2>

                <p>
                    Adventure
                </p>

            </div>

        </div>


        <div class="game"
             onclick="selectGame(this)"
             data-name="Racing">

            <img src=
            "https://images.unsplash.com/photo-1503736334956-4c8f8e92946d">

            <div class="game-info">

                <h2>
                    Racing
                </h2>

                <p>
                    Racing
                </p>

            </div>

        </div>


        <div class="game"
             onclick="selectGame(this)"
             data-name="Football">

            <img src=
            "https://images.unsplash.com/photo-1579952363873-27f3bade9f55">

            <div class="game-info">

                <h2>
                    Football
                </h2>

                <p>
                    Sports
                </p>

            </div>

        </div>

    </section>


    <div class="actions">

        <button class="action"
                onclick="launch()">
            ▶ تشغيل
        </button>

        <button class="action"
                onclick="library()">
            📚 مكتبة الألعاب
        </button>

        <button class="action"
                onclick="openControlCenter()">
            🎮 مركز التحكم
        </button>

        <button class="action"
                onclick="settings()">
            ⚙ الإعدادات
        </button>

    </div>

</main>


<!-- CONTROL CENTER -->

<div class="control-center"
     id="controlCenter">

    <div class="control-title">
        مركز التحكم
    </div>

    <div class="controls">

        <button class="control"
                onclick="show('🌐 الشبكة')">
            🌐
            <br>
            الشبكة
        </button>

        <button class="control"
                onclick="show('🔊 الصوت')">
            🔊
            <br>
            الصوت
        </button>

        <button class="control"
                onclick="show('🎮 وحدة التحكم')">
            🎮
            <br>
            وحدة التحكم
        </button>

        <button class="control"
                onclick="notifications()">
            🔔
            <br>
            الإشعارات
        </button>

        <button class="control"
                onclick="show('⬇️ التنزيلات')">
            ⬇️
            <br>
            التنزيلات
        </button>

        <button class="control"
                onclick="settings()">
            ⚙
            <br>
            الإعدادات
        </button>

        <button class="control"
                onclick="show('🎵 الموسيقى')">
            🎵
            <br>
            الموسيقى
        </button>

        <button class="control"
                onclick="power()">
            ⏻
            <br>
            الطاقة
        </button>

    </div>

</div>


<!-- MODAL -->

<div class="overlay"
     id="overlay">

    <div class="modal">

        <h2 id="modalTitle">
            Console
        </h2>

        <p id="modalText">
            ...
        </p>

        <button class="close"
                onclick="closeModal()">
            إغلاق
        </button>

    </div>

</div>


<script>

/* ================= GAME SELECTION ================= */

let selected =
    document.querySelector(".game.selected");


function selectGame(game){

    document
        .querySelectorAll(".game")
        .forEach(x =>
            x.classList.remove("selected")
        );

    game.classList.add("selected");

    selected = game;

    sound(520);
}


/* ================= LAUNCH ================= */

function launch(){

    if(!selected) return;

    const name =
        selected.dataset.name;

    show(
        "▶ تشغيل اللعبة",
        "جاري تشغيل " + name +
        " 🎮<br><br>" +
        "في المرحلة القادمة سنضيف ألعاب HTML فعلية."
    );

    sound(700);
}


/* ================= CONTROL CENTER ================= */

function openControlCenter(){

    document
        .getElementById("controlCenter")
        .classList.toggle("open");

    sound(400);
}


/* ================= LIBRARY ================= */

function library(){

    show(
        "📚 مكتبة الألعاب",
        "Grand Theft Auto V<br>" +
        "Fortnite<br>" +
        "Minecraft<br>" +
        "Racing<br>" +
        "Football"
    );
}


/* ================= PROFILE ================= */

function profile(){

    show(
        "👤 الملف الشخصي",
        "اللاعب: G<br><br>" +
        "الألعاب: 5<br>" +
        "الإنجازات: 12<br>" +
        "وقت اللعب: 24 ساعة"
    );
}


/* ================= SETTINGS ================= */

function settings(){

    show(
        "⚙ الإعدادات",
        "الشبكة<br><br>" +
        "الصوت<br><br>" +
        "الشاشة<br><br>" +
        "وحدة التحكم<br><br>" +
        "النظام"
    );
}


/* ================= NOTIFICATIONS ================= */

function notifications(){

    show(
        "🔔 الإشعارات",
        "لا توجد إشعارات جديدة."
    );
}


/* ================= POWER ================= */

function power(){

    show(
        "⏻ الطاقة",
        "وضع السكون<br><br>" +
        "إعادة التشغيل<br><br>" +
        "إيقاف التشغيل"
    );
}


/* ================= MODAL ================= */

function show(title,text){

    document
        .getElementById("modalTitle")
        .innerHTML = title;

    document
        .getElementById("modalText")
        .innerHTML = text;

    document
        .getElementById("overlay")
        .classList.add("show");

    sound(600);
}


function closeModal(){

    document
        .getElementById("overlay")
        .classList.remove("show");
}


/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    function(e){

        const games =
            [...document.querySelectorAll(".game")];

        let index =
            games.indexOf(selected);


        if(e.key === "ArrowRight"){

            index++;

            if(index >= games.length)
                index = 0;

            selectGame(games[index]);
        }


        if(e.key === "ArrowLeft"){

            index--;

            if(index < 0)
                index = games.length - 1;

            selectGame(games[index]);
        }


        if(e.key === "Enter"){

            launch();
        }


        if(e.key === "Escape"){

            closeModal();

            document
                .getElementById("controlCenter")
                .classList.remove("open");
        }

    }
);


/* ================= SOUND ================= */

/*
   أصوات بسيطة يتم توليدها من المتصفح.
   سنستبدلها لاحقاً بنظام صوتي كامل من تصميمنا.
*/

function sound(freq){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.frequency.value =
            freq;

        oscillator.type =
            "sine";

        gain.gain.setValueAtTime(
            .04,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .12
        );

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .12
        );

    }catch(e){}

}

</script>

</body>
</html>
