<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    GLTFLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

import {
    DRACOLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/DRACOLoader.js";

import {
    Sky
} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/objects/Sky.js";


/* ==========================================
   VARIABLES
========================================== */

let scene;
let camera;
let renderer;

let car;
let carModel;

let clock =
    new THREE.Clock();

let started=false;

let speed=0;

let heading=0;

let steer=0;

let driftScore=0;

let lastDriftTime=0;

let cameraShake=0;

const keys={};

const smoke=[];

const skidMarks=[];

const wheelNodes=[];

const frontWheelNodes=[];


/* ==========================================
   ELEMENTS
========================================== */

const loading =
    document.getElementById(
        "loading"
    );

const loaderBar =
    document.getElementById(
        "loaderBar"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const hud =
    document.getElementById(
        "hud"
    );

const speedElement =
    document.getElementById(
        "speed"
    );

const gearElement =
    document.getElementById(
        "gear"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const driftElement =
    document.getElementById(
        "driftText"
    );


/* ==========================================
   INITIALIZE
========================================== */

async function init(){

    createScene();

    createLighting();

    createEnvironment();

    createRoads();

    createBuildings();

    createTrees();

    createStreetLights();

    createParkingArea();

    await loadCar();

    resetCar();

    animate();

    setLoading(
        100,
        "اكتمل التحميل"
    );

    setTimeout(
        ()=>{
            loading.style.display="none";
            startScreen.style.display="flex";
        },
        500
    );

}


/* ==========================================
   LOADING
========================================== */

function setLoading(
    percent,
    text
){

    loaderBar.style.width =
        percent+"%";

    loadingText.textContent =
        text;

}


/* ==========================================
   SCENE
========================================== */

function createScene(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x87b5d9
        );

    scene.fog =
        new THREE.FogExp2(
            0x9eb8c8,
            .0025
        );


    camera =
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            1500
        );


    camera.position.set(
        0,
        4,
        -10
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:
                "high-performance"
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            1.5
        )
    );


    renderer.shadowMap.enabled=true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.15;


    document
        .getElementById("game")
        .appendChild(
            renderer.domElement
        );

}


/* ==========================================
   SKY + LIGHTING
========================================== */

function createLighting(){

    const sky =
        new Sky();

    sky.scale.setScalar(450);

    scene.add(sky);


    const uniforms =
        sky.material.uniforms;

    uniforms
        .turbidity
        .value=4;

    uniforms
        .rayleigh
        .value=1.4;

    uniforms
        .mieCoefficient
        .value=.006;

    uniforms
        .mieDirectionalG
        .value=.8;


    const sun =
        new THREE.Vector3();

    sun.setFromSphericalCoords(
        450,
        THREE.MathUtils.degToRad(65),
        THREE.MathUtils.degToRad(180)
    );

    uniforms
        .sunPosition
        .value
        .copy(sun);


    const hemi =
        new THREE.HemisphereLight(
            0xd7efff,
            0x29313b,
            1.5
        );

    scene.add(hemi);


    const sunlight =
        new THREE.DirectionalLight(
            0xfff2d2,
            3
        );


    sunlight.position.set(
        -100,
        180,
        -80
    );


    sunlight.castShadow=true;


    sunlight.shadow.mapSize.width=2048;

    sunlight.shadow.mapSize.height=2048;


    sunlight.shadow.camera.left=-250;
    sunlight.shadow.camera.right=250;
    sunlight.shadow.camera.top=250;
    sunlight.shadow.camera.bottom=-250;


    sunlight.shadow.camera.near=1;
    sunlight.shadow.camera.far=500;


    scene.add(sunlight);

}


/* ==========================================
   ENVIRONMENT
========================================== */

function createEnvironment(){

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1000,
                1000
            ),

            new THREE.MeshStandardMaterial({
                color:0x38433d,
                roughness:.9
            })

        );


    ground.rotation.x =
        -Math.PI/2;


    ground.receiveShadow=true;


    scene.add(ground);


    /* grass areas */

    for(
        let x=-400;
        x<=400;
        x+=35
    ){

        const grass =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    27,
                    .08,
                    27
                ),

                new THREE.MeshStandardMaterial({
                    color:0x304638,
                    roughness:1
                })

            );


        grass.position.set(
            x,
            .04,
            120
        );


        scene.add(grass);

    }

}


/* ==========================================
   ROADS
========================================== */

function createRoads(){

    createRoad(
        0,
        0,
        900,
        32,
        0
    );


    createRoad(
        0,
        0,
        900,
        32,
        Math.PI/2
    );


    createRoad(
        0,
        90,
        900,
        22,
        0
    );


    createRoad(
        120,
        0,
        220,
        22,
        Math.PI/2
    );


    createRoad(
        -120,
        0,
        220,
        22,
        Math.PI/2
    );


    createRoad(
        0,
        -120,
        900,
        22,
        0
    );


    createRoadLines();

}


function createRoad(
    x,
    z,
    length,
    width,
    rotation
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                length,
                .08,
                width
            ),

            new THREE.MeshStandardMaterial({
                color:0x202326,
                roughness:.72,
                metalness:.08
            })

        );


    road.position.set(
        x,
        .06,
        z
    );


    road.rotation.y =
        rotation;


    road.receiveShadow=true;


    scene.add(road);

}


/* ==========================================
   ROAD LINES
========================================== */

function createRoadLines(){

    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color:0xe6c94a
        });


    for(
        let x=-430;
        x<430;
        x+=16
    ){

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    8,
                    .11,
                    .18
                ),

                lineMaterial

            );


        line.position.set(
            x,
            .13,
            0
        );


        scene.add(line);


        const line2 =
            line.clone();


        line2.position.z =
            90;


        scene.add(line2);


        const line3 =
            line.clone();


        line3.position.z =
            -120;


        scene.add(line3);

    }

}


/* ==========================================
   BUILDINGS
========================================== */

function createBuildings(){

    const colors=[
        0x70777c,
        0x59636a,
        0x464f56,
        0x7c7d79,
        0x3f494d
    ];


    for(
        let x=-320;
        x<=320;
        x+=45
    ){

        for(
            let z=-280;
            z<=260;
            z+=50
        ){

            if(
                Math.abs(x)<65 &&
                Math.abs(z)<150
            ){
                continue;
            }


            if(
                Math.abs(x)<170 &&
                Math.abs(z-90)<35
            ){
                continue;
            }


            const width =
                25+
                Math.random()*12;


            const depth =
                28+
                Math.random()*12;


            const height =
                12+
                Math.random()*55;


            const building =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        width,
                        height,
                        depth
                    ),

                    new THREE.MeshStandardMaterial({
                        color:
                            colors[
                                Math.floor(
                                    Math.random()*
                                    colors.length
                                )
                            ],
                        roughness:.9
                    })

                );


            building.position.set(
                x+
                (Math.random()-.5)*7,

                height
