<!-- =========================
     LOGIN SYSTEM
========================= -->

<style>

.login-button{
    background:rgba(0,229,255,.08);
    color:#00e5ff;
    border:1px solid rgba(0,229,255,.45);
    padding:9px 17px;
    border-radius:8px;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    cursor:pointer;
    transition:.3s;
}

.login-button:hover{
    background:#00e5ff;
    color:#001015;
    box-shadow:0 0 25px rgba(0,229,255,.35);
}

.login-modal{
    position:fixed;
    inset:0;
    z-index:999999;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-modal.active{
    display:flex;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#080c14;
    border:1px solid rgba(0,229,255,.3);
    border-radius:18px;
    padding:35px;
    position:relative;
    box-shadow:
        0 0 80px rgba(0,229,255,.12),
        inset 0 0 30px rgba(0,229,255,.025);
}

.login-close{
    position:absolute;
    top:12px;
    left:17px;
    border:0;
    background:none;
    color:#777;
    font-size:27px;
    cursor:pointer;
}

.login-close:hover{
    color:#00e5ff;
}

.login-title{
    text-align:center;
    font-size:29px;
    font-weight:900;
}

.login-title span{
    color:#00e5ff;
    text-shadow:0 0 15px #00e5ff;
}

.login-description{
    text-align:center;
    color:#707988;
    font-size:12px;
    margin:7px 0 28px;
}

.login-field{
    margin-bottom:18px;
}

.login-field label{
    display:block;
    color:#aab2bd;
    font-size:12px;
    margin-bottom:8px;
}

.login-field input{
    width:100%;
    padding:13px;
    background:#04070c;
    border:1px solid #202a38;
    border-radius:8px;
    color:white;
    outline:none;
    font-family:'Cairo',sans-serif;
    font-size:13px;
    direction:rtl;
}

.login-field input:focus{
    border-color:#00e5ff;
    box-shadow:0 0 15px rgba(0,229,255,.1);
}

.login-submit{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#00e5ff;
    color:#001015;
    font-family:'Cairo',sans-serif;
    font-weight:900;
    cursor:pointer;
    transition:.3s;
}

.login-submit:hover{
    box-shadow:0 0 25px rgba(0,229,255,.4);
    transform:translateY(-2px);
}

.login-note{
    text-align:center;
    color:#596270;
    font-size:10px;
    line-height:1.8;
    margin-top:15px;
}

.user-box{
    text-align:center;
}

.user-avatar{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#00e5ff;
    color:#001015;
    font-size:28px;
    font-weight:900;
    box-shadow:0 0 30px rgba(0,229,255,.25);
}

.user-box h3{
    margin-top:15px;
    font-size:20px;
}

.user-email{
    color:#697482;
    font-size:12px;
    margin-top:5px;
}

.logout-button{
    margin-top:22px;
    padding:10px 25px;
    border-radius:8px;
    border:1px solid rgba(255,70,70,.3);
    background:#171016;
    color:#ff6b6b;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    cursor:pointer;
}

@media(max-width:600px){

    .login-box{
        padding:25px;
    }

}

</style>


<!-- =========================
     LOGIN MODAL
========================= -->

<div class="login-modal" id="loginModal">

    <div class="login-box">

        <button
            class="login-close"
            onclick="closeLogin()">
            ×
        </button>


        <!-- REGISTER FORM -->

        <div id="loginForm">

            <div class="login-title">
                WIFI5<span>GAMES</span>
            </div>

            <div class="login-description">
                سجّل دخولك إلى عالم الألعاب
            </div>


            <div class="login-field">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@gmail.com"
                    autocomplete="email">

            </div>


            <div class="login-field">

                <label>
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="اكتب اسم المستخدم"
                    maxlength="20"
                    autocomplete="username">

            </div>


            <button
                class="login-submit"
                onclick="loginUser()">

                تسجيل الدخول

            </button>


            <div class="login-note">
                تسجيل الدخول باستخدام الإيميل واسم المستخدم فقط.<br>
                لا يوجد رمز تحقق OTP.
            </div>

        </div>


        <!-- USER PROFILE -->

        <div
            class="user-box"
            id="userBox"
            style="display:none;">

            <div
                class="user-avatar"
                id="userAvatar">
                W
            </div>

            <h3 id="userName">
                مرحباً
            </h3>

            <div
                class="user-email"
                id="userEmail">
            </div>

            <button
                class="logout-button"
                onclick="logoutUser()">

                تسجيل الخروج

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   OPEN LOGIN
========================= */

function openLogin(){

    document
    .getElementById("loginModal")
    .classList.add("active");

    checkLogin();

}


/* =========================
   CLOSE LOGIN
========================= */

function closeLogin(){

    document
    .getElementById("loginModal")
    .classList.remove("active");

}


/* =========================
   LOGIN
========================= */

function loginUser(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();


    if(email === ""){

        alert("⚠️ اكتب البريد الإلكتروني.");

        return;

    }


    if(!email.includes("@") ||
       !email.includes(".")){

        alert("⚠️ البريد الإلكتروني غير صحيح.");

        return;

    }


    if(username === ""){

        alert("⚠️ اكتب اسم المستخدم.");

        return;

    }


    if(username.length < 3){

        alert(
            "⚠️ اسم المستخدم يجب أن يكون 3 أحرف على الأقل."
        );

        return;

    }


    const user = {

        email:email,

        username:username

    };


    localStorage.setItem(
        "wifi5games_user",
        JSON.stringify(user)
    );


    showUser(user);


    alert(
        "🎮 أهلاً بك " +
        username +
        " في WIFI5GAMES!"
    );

}


/* =========================
   SHOW USER
========================= */

function showUser(user){

    document
    .getElementById("loginForm")
    .style.display = "none";


    document
    .getElementById("userBox")
    .style.display = "block";


    document
    .getElementById("userName")
    .textContent =
        "مرحباً " + user.username;


    document
    .getElementById("userEmail")
    .textContent =
        user.email;


    document
    .getElementById("userAvatar")
    .textContent =
        user.username
        .charAt(0)
        .toUpperCase();

}


/* =========================
   CHECK LOGIN
========================= */

function checkLogin(){

    const saved =
        localStorage.getItem(
            "wifi5games_user"
        );


    if(saved){

        try{

            const user =
                JSON.parse(saved);

            showUser(user);

        }catch(error){

            localStorage.removeItem(
                "wifi5games_user"
            );

        }

    }else{

        document
        .getElementById("loginForm")
        .style.display = "block";

        document
        .getElementById("userBox")
        .style.display = "none";

    }

}


/* =========================
   LOGOUT
========================= */

function logoutUser(){

    localStorage.removeItem(
        "wifi5games_user"
    );


    document
    .getElementById("loginForm")
    .style.display = "block";


    document
    .getElementById("userBox")
    .style.display = "none";


    document
    .getElementById("loginEmail")
    .value = "";


    document
    .getElementById("loginUsername")
    .value = "";


    alert("تم تسجيل الخروج.");

}


/* =========================
   CLOSE WHEN CLICK OUTSIDE
========================= */

document
.getElementById("loginModal")
.addEventListener("click",function(e){

    if(e.target === this){

        closeLogin();

    }

});


/* =========================
   CHECK USER ON START
========================= */

window.addEventListener("load",function(){

    const saved =
        localStorage.getItem(
            "wifi5games_user"
        );

    if(saved){

        console.log(
            "WIFI5GAMES user is logged in."
        );

    }

});

</script>
