<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WIFI5GAMES | عالم الألعاب</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#05070d;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
    linear-gradient(rgba(0,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#0066ff;
    opacity:.08;
    filter:blur(120px);
    left:-150px;
    top:100px;
    z-index:-1;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:#020409;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.loader-content{
    width:90%;
    max-width:500px;
}

.loader-logo{
    font-size:clamp(42px,10vw,80px);
    font-weight:900;
    letter-spacing:4px;
    text-shadow:
    0 0 10px #00eaff,
    0 0 30px #00eaff,
    0 0 70px #0066ff;
}

.loader-logo span{
    color:#00eaff;
}

.loader-sub{
    color:#8995a8;
    margin-top:8px;
    letter-spacing:3px;
    font-size:12px;
}

.loader-circle{
    width:80px;
    height:80px;
    margin:35px auto 25px;
    border:4px solid #151c29;
    border-top-color:#00eaff;
    border-right-color:#7b2cff;
    border-radius:50%;
    animation:rotate 1s linear infinite;
}

.loader-line{
    width:100%;
    height:7px;
    background:#111725;
    border-radius:20px;
    overflow:hidden;
}

.loader-line div{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00eaff,#1677ff,#7b2cff);
    box-shadow:0 0 20px #00eaff;
}

#loaderPercent{
    color:#00eaff;
    margin-top:12px;
    font-weight:bold;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

/* LOGIN */

#login{
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
    radial-gradient(circle at center,rgba(0,234,255,.10),transparent 35%);
}

.login-box{
    width:100%;
    max-width:430px;
    background:#0a101b;
    border:1px solid rgba(0,234,255,.25);
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 80px rgba(0,234,255,.08);
}

.login-logo{
    font-size:34px;
    font-weight:900;
}

.login-logo span{
    color:#00eaff;
}

.login-box h2{
    margin-top:15px;
}

.login-box p{
    color:#8490a4;
    font-size:14px;
    margin:8px 0 25px;
}

.input{
    width:100%;
    height:52px;
    margin-bottom:12px;
    padding:0 15px;
    background:#050912;
    color:white;
    border:1px solid #1b2638;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#00eaff;
}

.login-button{
    width:100%;
    height:52px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#00eaff,#1677ff);
    color:#001018;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    min-height:22px;
    margin-top:10px;
    color:#ff5577;
    font-size:13px;
}

/* WEBSITE */

#website{
    display:none;
}

/* NAV */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(4,7,13,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #151c29;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:900;
    text-decoration:none;
}

.logo span{
    color:#00eaff;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#a4afc1;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#00eaff;
}

.user{
    display:flex;
    align-items:center;
    gap:8px;
}

.username{
    background:#0d1624;
    border:1px solid #1c2a3e;
    border-radius:20px;
    padding:8px 12px;
    font-size:12px;
}

.logout{
    border:1px solid #5b2433;
    background:#1d0c12;
    color:#ff6683;
    border-radius:9px;
    padding:8px 10px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:590px;
    padding:70px 7%;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:50px;
    align-items:center;
}

.badge{
    display:inline-block;
    color:#00eaff;
    border:1px solid rgba(0,234,255,.3);
    background:rgba(0,234,255,.05);
    border-radius:30px;
    padding:8px 15px;
    font-size:12px;
    font-weight:bold;
}

.hero h1{
    font-size:clamp(48px,7vw,90px);
    line-height:.95;
    margin:20px 0;
    font-weight:900;
}

.hero h1 span{
    color:#00eaff;
    text-shadow:0 0 35px rgba(0,234,255,.35);
}

.hero p{
    max-width:650px;
    color:#919db0;
    line-height:2;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:25px;
}

.button{
    display:inline-block;
    text-decoration:none;
    padding:13px 21px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:linear-gradient(135deg,#00eaff,#1677ff);
    color:#001018;
}

.secondary{
    background:#101827;
    border:1px solid #1c2738;
    color:white;
}

.hero-art{
    height:390px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(0,234,255,.25);
    background:
    radial-gradient(circle at 50% 40%,rgba(0,234,255,.25),transparent 20%),
    linear-gradient(145deg,#111d30,#070b12);
    display:flex;
    align-items:flex-end;
    padding:30px;
}

.hero-art::before{
    content:"GTA";
    position:absolute;
    font-size:150px;
    font-weight:900;
    color:white;
    opacity:.05;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
}

.hero-art::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border:2px solid rgba(0,234,255,.25);
    border-radius:50%;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    box-shadow:
    0 0 0 35px rgba(0,234,255,.04),
    0 0 0 70px rgba(0,234,255,.025);
}

.hero-title{
    position:relative;
    z-index:2;
}

.hero-title small{
    color:#00eaff;
}

.hero-title h2{
    font-size:55px;
    line-height:1;
    margin:7px 0;
}

/* STATS */

.stats{
    padding:0 7% 50px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    padding:22px;
    text-align:center;
    background:#0a101a;
    border:1px solid #151e2d;
    border-radius:18px;
}

.stat strong{
    display:block;
    font-size:30px;
    color:#00eaff;
}

.stat span{
    color:#8792a5;
    font-size:13px;
}

/* GAMES */

.games{
    padding:60px 6%;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:25px;
}

.section-header h2{
    font-size:35px;
}

.section-header p{
    color:#818da0;
    font-size:13px;
    margin-top:5px;
}

.search{
    width:330px;
    height:48px;
    background:#0a101a;
    color:white;
    border:1px solid #1b2638;
    border-radius:12px;
    padding:0 15px;
    outline:none;
}

.search:focus{
    border-color:#00eaff;
}

/* FILTERS */

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:25px;
}

.filter{
    background:#0b121e;
    color:#9ba7b9;
    border:1px solid #1a2536;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:bold;
}

.filter.active,
.filter:hover{
    background:#00eaff;
    color:#001018;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.card{
    overflow:hidden;
    background:#0b111c;
    border:1px solid #151f2f;
    border-radius:15px;
    transition
