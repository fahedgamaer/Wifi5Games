<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wifi5Games</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#050811;
    color:#fff;
    font-family:Arial,sans-serif
}

/* شاشة التحميل */
#loading{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      radial-gradient(circle at center,#18395b 0,#08101e 38%,#02040a 100%);
    transition:opacity .5s
}

.loading-logo{
    font-size:55px;
    font-weight:900;
    text-shadow:0 0 30px #00d9ff
}

.loading-logo span{color:#00d9ff}

.loading-text{
    margin-top:15px;
    color:#b9c7d9
}

.progress{
    width:300px;
    height:7px;
    background:#1c2940;
    border-radius:20px;
    overflow:hidden;
    margin-top:25px
}

.progress div{
    height:100%;
    width:0;
    background:#00d9ff;
    box-shadow:0 0 20px #00d9ff;
    animation:loading 2s linear forwards
}

@keyframes loading{
    to{width:100%}
}

/* الرأس */
header{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    gap:20px;
    padding:15px 5%;
    background:#080d19ee;
    backdrop-filter:blur(15px);
    border-bottom:1px solid #1c2940
}

.logo{
    font-size:28px;
    font-weight:900;
    white-space:nowrap
}

.logo span{color:#00d9ff}

.search{
    flex:1
}

.search input{
    width:100%;
    padding:14px 20px;
    border-radius:30px;
    border:1px solid #2c3b58;
    outline:0;
    background:#111a2c;
    color:white;
    font-size:16px
}

/* التصنيفات */
.categories{
    display:flex;
    gap:9px;
    padding:14px 5%;
    overflow-x:auto;
    background:#090f1d
}

.categories button{
    border:0;
    border-radius:22px;
    padding:10px 18px;
    background:#18243b;
    color:white;
    cursor:pointer;
    white-space:nowrap
}

.categories button.active,
.categories button:hover{
    background:#00d9ff;
    color:#001019
}

/* البطل */
.hero{
    margin:25px 5%;
    min-height:280px;
    padding:40px;
    border-radius:25px;
    display:flex;
    align-items:center;
    background:
      linear-gradient(90deg,#050913ee,#05091355),
      linear-gradient(135deg,#123f5b,#24163e,#081526);
    border:1px solid #29405f;
    box-shadow:0 20px 60px #0008
}

.hero h1{
    font-size:44px;
    margin:10px 0
}

.hero p{
    max-width:700px;
    color:#aebbd0;
    line-height:1.8
}

.badge{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;
    background:#00d9ff;
    color:#001019;
    font-weight:900
}

/* الألعاب */
main{
    padding-bottom:50px
}

.games{
    padding:0 5%;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px
}

.card{
    overflow:hidden;
    border-radius:17px;
    background:#10192b;
    border:1px solid #202f4a;
    transition:.2s
}

.card:hover{
    transform:translateY(-6px);
    border-color:#00d9ff;
    box-shadow:0 12px 35px #00d9ff16
}

.cover{
    width:100%;
    aspect-ratio:16/10;
    display:block;
    object-fit:cover
}

.info{
    padding:12px
}

.info h3{
    margin:0 0 7px;
    font-size:16px
}

.info small{
    color:#8796b0
}

.download{
    width:100%;
    margin-top:12px;
    border:0;
    border-radius:10px;
    padding:11px;
    background:#00d9ff;
    color:#001019;
    font-weight:900;
    cursor:pointer
}

.download:hover{
    background:#65e9ff
}

.empty{
    text-align:center;
    padding:80px;
    color:#8291aa
}

@media(max-width:650px){
    header{flex-wrap:wrap}
    .logo{width:100%;text-align:center}
    .games{
        grid-template-columns:repeat(2,1fr);
        gap:10px
    }
    .hero{
        margin:15px;
        padding:25px
    }
    .hero h1{font-size:31px}
}
</style>
</head>

<body>

<!-- ================================
     شاشة تحميل لمدة ثانيتين
================================ -->

<div id="loading">

    <div class="loading-logo">
        Wifi5<span>Games</span>
    </div>

    <div class="loading-text">
        جاري تحميل مكتبة الألعاب...
    </div>

    <div class="progress">
        <div></div>
    </div>

</div>


<header>

    <div class="logo">
        Wifi5<span>Games</span>
    </div>

    <div class="search">
        <input
            id="search"
            placeholder="🔎 ابحث عن لعبة..."
        >
    </div>

</header>


<nav class="categories" id="categories">

    <button class="active" data-cat="الكل">الكل</button>
    <button data-cat="أكشن">🔥 أكشن</button>
    <button data-cat="سباق">🏎️ سباق</button>
    <button data-cat="رياضة">⚽ رياضة</button>
    <button data-cat="مغامرات">🗺️ مغامرات</button>
    <button data-cat="قتال">🥊 قتال</button>
    <button data-cat="زومبي">🧟 زومبي</button>
    <button data-cat="ألغاز">🧩 ألغاز</button>

</nav>


<section class="hero">

    <div>

        <span class="badge">
            🎮 1000+ لعبة
        </span>

        <h1>
            Wifi5Games
        </h1>

        <p>
            مكتبة ألعاب ضخمة بتصميم عصري.
            ابحث عن لعبتك، اختر التصنيف،
            واضغط على تحميل مباشر للانتقال
            إلى الموقع الرسمي للعبة.
        </p>

    </div>

</section>


<main>

    <div id="games" class="games"></div>

    <div id="empty" class="empty" style="display:none">
        🔎 لا توجد ألعاب بهذا الاسم
    </div>

</main>


<script>

/* =====================================================
   أسماء الألعاب والتصنيفات
===================================================== */

const gameNames = [

"Grand Open World",
"Ultimate Racer",
"Football Stars",
"Zombie City",
"Ninja Warrior",
"Space Adventure",
"Mega Puzzle",
"Street Fighter",
"Super Drift",
"Galaxy Battle",
"Monster Attack",
"Extreme Soccer",
"Desert Rally",
"Dragon Quest",
"Cyber Warrior",
"Ocean Adventure",
"Tower Defense",
"City Driver",
"Basketball Pro",
"Zombie Hunter",
"Night Racer",
"Cyber City",
"War Zone",
"Speed Legends",
"Island Survivor",
"Battle Arena",
"Rocket Mission",
"Monster World",
"Street Racing",
"Football League"

];

const categories=[
"أكشن",
"سباق",
"رياضة",
"مغامرات",
"قتال",
"زومبي",
"ألغاز"
];


/* =====================================================
   غلاف SVG داخل HTML
   لا توجد صور خارجية
===================================================== */

function makeCover(name,index){

    const colors=[
        ["#071d35","#00c9ff"],
        ["#251035","#c83cff"],
        ["#351707","#ff8a00"],
        ["#082b1e","#00e69a"],
        ["#301015","#ff426b"],
        ["#11183d","#536dff"]
    ];

    const c=colors[index%colors.length];

    const svg=`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="640"
         height="400"
         viewBox="0 0 640 400">

        <defs>
            <linearGradient
                id="g${index}"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0"
                    stop-color="${c[0]}"/>

                <stop
                    offset="1"
                    stop-color="${c[1]}"/>
            </linearGradient>
        </defs>

        <rect
            width="640"
            height="400"
            fill="url(#g${index})"/>

        <circle
            cx="${100+(index%5)*120}"
            cy="100"
            r="130"
            fill="#ffffff"
            opacity=".08"/>

        <circle
            cx="540"
            cy="330"
            r="170"
            fill="#000"
            opacity=".20"/>

        <path
            d="M0 330 Q170 220 320 330 T640 290 V400 H0Z"
            fill="#000"
            opacity=".35"/>

        <text
            x="320"
            y="185"
            text-anchor="middle"
            fill="white"
            font-family="Arial"
            font-size="42"
            font-weight="900">

            ${name}

        </text>

        <text
            x="320"
            y="235"
            text-anchor="middle"
            fill="white"
            opacity=".75"
            font-family="Arial"
            font-size="18">

            WIFI5GAMES

        </text>

        <rect
            x="25"
            y="25"
            width="110"
            height="35"
            rx="18"
            fill="#000"
            opacity=".45"/>

        <text
            x="80"
            y="49"
            text-anchor="middle"
            fill="white"
            font-family="Arial"
            font-size="16">

            GAME #${index+1}

        </text>

    </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8,"+
        encodeURIComponent(svg);
}


/* =====================================================
   إنشاء 1050 لعبة
===================================================== */

const games=[];

for(let i=0;i<1050;i++){

    const base =
        gameNames[i % gameNames.length];

    const category =
        categories[i % categories.length];

    games.push({

        id:i+1,

        name:
            base +
            " " +
            (Math.floor(i/gameNames.length)+1),

        category:category,

        cover:
            makeCover(
                base,
                i
            ),

        /*
           ضع هنا الرابط الرسمي الحقيقي للعبة.
           حاليًا نستخدم بحث Google حتى لا نضع
           رابط تنزيل غير رسمي.
        */

        official:
            "https://www.google.com/search?q="+
            encodeURIComponent(
                base+" official website"
            )

    });

}


/* =====================================================
   عرض الألعاب
===================================================== */

const gamesBox=
    document.getElementById("games");

const empty=
    document.getElementById("empty");

const search=
    document.getElementById("search");

let currentCategory="الكل";


function render(){

    const query=
        search.value
        .trim()
        .toLowerCase();

    gamesBox.innerHTML="";

    const filtered=
        games.filter(game=>{

            const matchName=
                game.name
                .toLowerCase()
                .includes(query);

            const matchCategory=
                currentCategory==="الكل" ||
                game.category===currentCategory;

            return matchName && matchCategory;

        });


    empty.style.display=
        filtered.length
        ? "none"
        : "block";


    const fragment=
        document.createDocumentFragment();


    filtered.forEach(game=>{

        const card=
            document.createElement("article");

        card.className="card";

        card.innerHTML=`

            <img
                class="cover"
                src="${game.cover}"
                alt="${game.name}"
                loading="lazy"
            >

            <div class="info">

                <h3>
                    ${game.name}
                </h3>

                <small>
                    ${game.category}
                </small>

                <button
                    class="download"
                    data-url="${game.official}"
                >
                    ⬇️ تحميل مباشر
                </button>

            </div>

        `;


        card.querySelector(".download")
            .addEventListener(
                "click",
                function(){

                    window.open(
                        this.dataset.url,
                        "_blank",
                        "noopener,noreferrer"
                    );

                }
            );


        fragment.appendChild(card);

    });


    gamesBox.appendChild(fragment);

}


/* =====================================================
   البحث
===================================================== */

search.addEventListener(
    "input",
    render
);


/* =====================================================
   التصنيفات
===================================================== */

document
.querySelectorAll(".categories button")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(
                ".categories button"
            )
            .forEach(b=>
                b.classList.remove("active")
            );

            button.classList.add("active");

            currentCategory=
                button.dataset.cat;

            render();

        }
    );

});


/* =====================================================
   شاشة التحميل = ثانيتان
===================================================== */

setTimeout(()=>{

    const loading=
        document.getElementById("loading");

    loading.style.opacity="0";

    setTimeout(
        ()=>loading.remove(),
        500
    );

},2000);


/* تشغيل الموقع */
render();

</script>

</body>
</html>
