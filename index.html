<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wifi5Games | متجر الألعاب</title>

<meta name="description"
content="Wifi5Games - متجر ألعاب إلكتروني لعشاق الألعاب.">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#080b12;
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   شاشة التحميل
========================= */

#loader{
    position:fixed;
    inset:0;
    z-index:99999;

    background:
        radial-gradient(
            circle at center,
            #162b45,
            #080b12 65%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.7s;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-box{
    width:90%;
    max-width:650px;
    text-align:center;
}

.loader-logo{
    font-size:clamp(45px,8vw,80px);
    font-weight:900;
    color:#35b8ff;

    text-shadow:
        0 0 15px #35b8ff,
        0 0 40px #1688c9;
}

.loader-logo span{
    color:white;
}

.loader-welcome{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
}

.loader-text{
    color:#8996a8;
    margin-top:10px;
}

.progress{
    height:13px;
    background:#17202c;
    border-radius:30px;
    overflow:hidden;
    margin-top:30px;
}

.progress-bar{
    width:0;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #1688c9,
            #35b8ff,
            #8edcff
        );

    box-shadow:0 0 20px #35b8ff;
}

.percent{
    margin-top:12px;
    color:#35b8ff;
    font-weight:bold;
}

/* =========================
   الموقع
========================= */

#site{
    display:none;
}

#site.show{
    display:block;
}

/* =========================
   الهيدر
========================= */

header{
    position:sticky;
    top:0;
    z-index:5000;

    background:rgba(8,11,18,.94);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.nav{
    max-width:1300px;
    min-height:72px;

    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    gap:30px;
}

.logo{
    font-size:25px;
    font-weight:900;

    color:#35b8ff;
    white-space:nowrap;
}

.logo span{
    color:white;
}

.nav-links{
    display:flex;
    gap:24px;
    list-style:none;
    flex:1;
}

.nav-links a{
    color:#aab4c1;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.nav-links a:hover{
    color:#35b8ff;
}

/* أزرار تسجيل الدخول */

.auth-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.login-button,
.logout-button{
    border:0;
    cursor:pointer;

    padding:10px 15px;

    border-radius:8px;

    font-weight:bold;
    font-family:Arial,Tahoma,sans-serif;

    transition:.3s;
}

.login-button{
    background:
        linear-gradient(
            135deg,
            #1688c9,
            #35b8ff
        );

    color:#04111a;
}

.login-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(53,184,255,.25);
}

.logout-button{
    display:none;

    background:#18222e;
    color:#ff6b7d;

    border:1px solid #293747;
}

.logout-button:hover
