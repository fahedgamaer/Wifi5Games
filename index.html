<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WIFI5GAMES — عالم الألعاب</title>

<meta name="description"
content="WIFI5GAMES — عالم الألعاب. اكتشف أكثر من 100 لعبة شهيرة في مكان واحد.">

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Cairo',sans-serif;
    background:#05070c;
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   LOGIN SCREEN
========================= */

#loginScreen{
    position:fixed;
    inset:0;
    z-index:100000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#101b30 0%,#05070c 50%,#000 100%);
    overflow:hidden;
}

#loginScreen::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:center bottom;
    opacity:.5;
}

.login-glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#006eff;
    filter:blur(180px);
    opacity:.12;
}

.login-box{
    position:relative;
    z-index:5;
    width:min(450px,90%);
    padding:45px 35px;
    border:1px solid rgba(0,229,255,.25);
    border-radius:25px;
    background:rgba(5,10,20,.88);
    backdrop-filter:blur(25px);
    box-shadow:
        0 0 50px rgba(0,229,255,.08),
        inset 0 0 30px rgba(0,229,255,.025);
    text-align:center;
}

.login-logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px rgba(0,229,255,.6);
}

.login-logo span{
    color:#00e5ff;
}

.login-sub{
    color:#777;
    font-size:12px;
    letter-spacing:4px;
    margin-top:3px;
    margin-bottom:30px;
}

.login-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:8px;
}

.login-description{
    color:#888;
    font-size:13px;
    margin-bottom:25px;
}

.login-input{
    width:100%;
    padding:15px 17px;
    margin-bottom:14px;
    border:1px solid rgba(0,229,255,.15);
    border-radius:12px;
    outline:none;
    background:#080e18;
    color:white;
    font-family:'Cairo',sans-serif;
    font-size:14px;
    transition:.3s;
}

.login-input:focus{
    border-color:#00e5ff;
    box-shadow:0 0 15px rgba(0,229,255,.12);
}

.login-button-main{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#006eff,#00e5ff);
    color:#001018;
    font-family:'Cairo',sans-serif;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:.3s;
}

.login-button-main:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(0,229,255,.4);
}

.login-error{
    color:#ff4d6d;
    font-size:12px;
    min-height:20px;
    margin-bottom:8px;
}

/* =========================
   LOADER
========================= */

#loader{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at center,#101b30 0%,#05070c 48%,#000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
}

#loader::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    border:1px solid rgba(0,229,255,.15);
    box-shadow:
        0 0 80px rgba(0,229,255,.08),
        inset 0 0 80px rgba(0,229,255,.04);
    animation:loaderPulse 2s infinite;
}

#loader::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
        linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:center bottom;
    opacity:.4;
}

.loader-content{
    position:relative;
    z-index:3;
    text-align:center;
}

.loader-logo{
    font-size:clamp(40px,8vw,100px);
    font-weight:900;
    letter-spacing:5px;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px rgba(0,229,255,.8),
        0 0 80px rgba(0,229,255,.3);
}

.loader-logo span{
    color:#00e5ff;
}

.loader-sub{
    margin-top:5px;
    color:#aaa;
    letter-spacing:8px;
    font-size:14px;
}

.loader-line{
    width:min(500px,80vw);
    height:5px;
    background:#18202d;
    margin:40px auto 15px;
    border-radius:50px;
    overflow:hidden;
}

.loader-progress{
    height:100%;
    width:0%;
    background
